name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.7"

      # --locked: fail if uv.lock is stale instead of silently re-resolving.
      # The image extra makes the ONNX image-redaction tests run, not skip.
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra image

      - name: Ruff format check
        run: uv run ruff format --check src tests evals tools scripts

      - name: Ruff lint
        run: uv run ruff check src tests evals tools scripts

      - name: Run tests
        run: uv run pytest -q

      - name: Static types (mypy)
        run: uv run mypy

