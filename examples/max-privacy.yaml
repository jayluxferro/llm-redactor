# Maximum privacy: local routing + redaction + rephrase (A+B+C)
#
# Best for: highest privacy with cloud fallback for complex tasks
# Eval result (harness, re-run 2026-11-12): 0.0% combined leak on PII,
#              1.0% on secrets, 15.7% on code
# Trade-off: 0.15-1.4 s latency, requires Ollama for classification + rephrase
#
# IMPORTANT: local routing (A) and rephrasing (C) exist only in the
# evaluation harness (evals/runner.py). `serve` and `mcp` run Option B
# alone, so under the proxy this file redacts (with LLM validation) and
# forwards every request: nothing is answered locally and nothing is
# rephrased. The figures above are what the full pipeline achieves in the
# harness, not what the proxy does.
#
# Usage:
#   cp examples/max-privacy.yaml llm_redactor.yaml
#   export OPENAI_API_KEY=sk-...
#   ollama serve
#   uv run llm-redactor serve --port 7789

cloud_target:
  endpoint: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY

local_model:
  endpoint: http://127.0.0.1:11434
  chat_model: llama3.2:3b

transport:
  http_port: 7789

pipeline:
  # LLM validation: second-pass check on NER detections using local model.
  # Catches false positives (drug names as persons, abbreviations as orgs).
  # Adds one Ollama round-trip (~300ms). Recommended when accuracy matters.
  llm_validation: { enabled: true }

  # Option A: route trivial requests locally (evaluation harness only)
  opt_a_local_only: { enabled: true }

  # Option B: NER + regex redaction on cloud-bound requests
  opt_b_redact: { enabled: true, strict: false }

  # Option C: semantic rephrase for implicit identity (evaluation harness only)
  opt_c_rephrase: { enabled: true, require_validator_pass: true }

policy:
  categories: [pii, secret, org_identifier, customer_name]
