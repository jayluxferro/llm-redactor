version: 1
local_model:
  endpoint: http://127.0.0.1:11434
  chat_model: llama3.2:3b
pipeline:
  llm_validation:
    enabled: true
  opt_b_redact:
    enabled: true
    strict: false
  # Optional, non-commercial local image PII redaction. Download a compatible
  # Screenpipe ONNX model yourself; weights are not distributed by this project.
  image_redaction:
    enabled: false
    license_acknowledged: false
    model_path: ~/models/screenpipe/rfdetr_v13.onnx  # wherever you saved it
    input_size: 384
    score_threshold: 0.8
policy:
  categories: [all]
