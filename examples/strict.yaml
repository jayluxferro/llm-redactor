# Strict mode: refuse on low-confidence detections
#
# Best for: regulated environments where false negatives are unacceptable
# Behaviour: if the detector finds a span with confidence < 0.5,
#            the request is refused with HTTP 422 (proxy) or error (MCP)
#            rather than silently passing it through.
#
# Trade-off: higher refusal rate. It cannot refuse what no detector finds:
#            values the detectors miss entirely still go out.
#
# Usage:
#   cp examples/strict.yaml llm_redactor.yaml
#   export OPENAI_API_KEY=sk-...
#   uv run llm-redactor serve --port 7789

cloud_target:
  endpoint: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY

local_model:
  endpoint: http://127.0.0.1:11434
  chat_model: llama3.2:3b
  # NER spans below this floor are dropped before the strict check runs.
  # At the default 0.5 nothing under 0.5 would survive to be refused, so
  # strict mode would never fire; 0.3 lets weak NER hits reach it.
  ner_confidence_floor: 0.3

transport:
  http_port: 7789

pipeline:
  opt_b_redact:
    enabled: true
    strict: true  # refuse on low-confidence detections

policy:
  categories: [pii, secret, org_identifier, customer_name]
