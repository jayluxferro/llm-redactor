[project]
name = "llm-redactor"
version = "0.1.0"
description = "Privacy-preserving shim for outbound LLM requests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "Justice Owusu Agyemang", email = "jay@sperixlabs.org" },
  { name = "Jerry John Kponyo", email = "jjkponyo.soe@knust.edu.gh" },
  { name = "Elliot Amponsah", email = "eamponsah52@st.knust.edu.gh" },
  { name = "Godfred Manu Addo Boakye", email = "gmaboakye@st.knust.edu.gh" },
  { name = "Kwame Opuni-Boachie Obour Agyekum", email = "kooagyekum@knust.edu.gh" },
]
dependencies = [
  "httpx>=0.27",
  # 1.30 fixes four advisories (GHSA-84m7-p3x7-pcfv and three more). 2.x
  # reworks the low-level server API transport/mcp_server.py is built on:
  # a migration of its own, not a security bump.
  "mcp>=1.30,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pyyaml>=6.0",
  "presidio-analyzer>=2.2",
  "spacy>=3.7",
  # Solana/NEAR keypair verification in detect/wallets.py (was only present
  # transitively, through the never-imported presidio-anonymizer).
  "cryptography>=42",
  # spaCy NER model (default) — source pinned in [tool.uv.sources] so `uv sync` keeps it installed.
  "en-core-web-sm==3.8.0",
  "typer>=0.15",
  "rich>=13.0",
  # Security pins — transitive deps with known advisories; floor patched versions.
  "pyjwt>=2.15.0",
  "urllib3>=2.8.0",
  "anyio>=4.14.2",
  "certifi>=2026.10.18",  # GHSA-6q48-6c7w-9gw2: compromised emSign roots (httpx, requests)
  "filelock>=4.2.1",  # 9 lock-file advisories (presidio's tldextract; torch, HF in extras)
  "setuptools>=84.1.0",  # GHSA-xmj3-9gf7-h52w (spaCy, thinc)
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-httpx>=0.35",
  "ruff>=0.8",
  "mypy>=1.8",
  "types-PyYAML>=6.0",
]
image = [
  "numpy>=2.0",
  "onnxruntime>=1.20",
  # 13.0 fixes 41 advisories, several in the PNG/JPEG code this extra uses.
  "pillow>=13.0",
]
# Figures (evals/generate_figures.py).
evals = [
  "matplotlib>=3.8",
  "pillow>=13.0",  # matplotlib's; floor the patched version (see the image extra)
]
# scripts/upload_hf_dataset.py only.  Resolved apart from ner-trf (see
# [tool.uv] conflicts): datasets caps fsspec / huggingface-hub, and resolving
# both together dragged the ML stack backwards (transformers to 4.12 once).
hf = [
  "datasets>=2.18",
]
ner-trf = [
  "spacy-transformers>=1.3",
  "torch>=2.0",
  "en-core-web-trf==3.8.0",
]

[project.scripts]
llm-redactor = "llm_redactor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_redactor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["evals/results", "evals/results_*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "."]
packages = ["llm_redactor", "evals"]
explicit_package_bases = true
warn_unused_ignores = true
# Comparing incompatible types is always False: this is what let evals/runner.py
# compare classify()'s (label, raw) tuple to "TRIVIAL" for months.
strict_equality = true

[[tool.mypy.overrides]]
module = ["onnxruntime", "PIL", "PIL.*"]
ignore_missing_imports = true

[tool.uv]
conflicts = [[{ extra = "hf" }, { extra = "ner-trf" }]]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
en-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }
