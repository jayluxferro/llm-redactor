[project]
name = "llm-redactor"
version = "0.1.0"
description = "Privacy-preserving shim for outbound LLM requests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "Justice Owusu Agyemang", email = "jay@sperixlabs.org" },
  { name = "Jerry John Kponyo", email = "jjkponyo.soe@knust.edu.gh" },
  { name = "Elliot Amponsah", email = "eamponsah52@st.knust.edu.gh" },
  { name = "Godfred Manu Addo Boakye", email = "gmaboakye@st.knust.edu.gh" },
  { name = "Kwame Opuni-Boachie Obour Agyekum", email = "kooagyekum@knust.edu.gh" },
]
dependencies = [
  "httpx>=0.27",
  "mcp>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pyyaml>=6.0",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy>=3.7",
  # spaCy NER model (default) — source pinned in [tool.uv.sources] so `uv sync` keeps it installed.
  "en-core-web-sm==3.8.0",
  "typer>=0.15",
  "rich>=13.0",
  "tiktoken>=0.8",
  # Security pins — transitive deps with known advisories; floor patched versions.
  "pyjwt>=2.15.0",
  "urllib3>=2.8.0",
  "anyio>=4.14.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-httpx>=0.35",
  "ruff>=0.8",
  "mypy>=1.8",
  "types-PyYAML>=6.0",
]
image = [
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "pillow>=10.0",
]
ner-trf = [
  "spacy-transformers>=1.3",
  "torch>=2.0",
  "en-core-web-trf==3.8.0",
]

[project.scripts]
llm-redactor = "llm_redactor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_redactor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["evals/results", "evals/results_*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "."]
packages = ["llm_redactor", "evals"]
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["onnxruntime", "PIL", "PIL.*"]
ignore_missing_imports = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
en-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }
